# Server edition DB migrations (server design 3.1, ADR-S8). Run from the repository root:
#   YTC_DB_OWNER_DSN=postgresql://ytc_owner:...@postgres/ytc #   YTC_DB_DSN=postgresql://ytc_app:...@postgres/ytc #   python -m alembic -c server/alembic.ini upgrade head
# YTC_DB_OWNER_DSN: owner that creates the tables (superuser or BYPASSRLS).
# YTC_DB_DSN: the app role name and password are read from it and the role is created/updated.
# Keep this file ASCII (configparser reads it with the locale encoding). No credentials here, env only.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
