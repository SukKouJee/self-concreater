<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$title · yt-coach</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; margin: 0; background: #f6f7f9; color: #1d2330; }
  main { max-width: 400px; margin: 12vh auto; padding: 28px; background: #fff; border: 1px solid #e3e6ec; border-radius: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; line-height: 1.6; overflow-wrap: anywhere; }
  a.button { display: inline-block; padding: 9px 16px; border-radius: 8px; background: #2f5bea; color: #fff; text-decoration: none; }
  a.button:focus-visible { outline: 3px solid #1d2330; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>$title</h1>
  <p role="alert">$message</p>
  <a class="button" href="/auth/login">로그인 화면으로</a>
</main>
</body>
</html>
